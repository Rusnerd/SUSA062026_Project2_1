<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="utf-8"><title>Experience Reservations</title></head>
<body>
<h1>Experience Reservations (Feign to REST service)</h1>
<p th:if="${message}" th:text="${message}"></p>
<p th:if="${error}" th:text="${error}"></p>
<h2>Create experience reservation</h2>
<form th:action="@{/experiences}" method="post">
  <div><label>Experience name</label><input name="name" required></div>
  <div><label>Guest name</label><input name="guestName" required></div>
  <div><label>When</label><input type="date" name="date" required></div>
  <button type="submit">Create</button>
</form>
<hr>
<h2>My reservations</h2>
<ul>
  <li th:each="er : ${reservations}">
    <b th:text="${er.guestName}"></b> - <span th:text="${er.name}"></span>
    on <span th:text="${er.date}"></span>
    status=<span th:text="${er.status}"></span>
    <div>
      <form th:action="@{/experiences/{id}/confirm(id=${er.id})}" method="post" style="display:inline">
        <button type="submit" th:disabled="${!er.confirmable}">Confirm</button>
      </form>
      <form th:action="@{/experiences/{id}/cancel(id=${er.id})}" method="post" style="display:inline">
        <button type="submit" th:disabled="${!er.cancelable}">Cancel</button>
      </form>
    </div>
  </li>
</ul>
<p><a th:href="@{/}">Back</a></p>
</body>
</html>
