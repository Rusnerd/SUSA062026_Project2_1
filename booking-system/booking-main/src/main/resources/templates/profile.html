<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Profile</title>
</head>
<body>
    <h1>My profile</h1>

    <p th:if="${param.updated}">Profile updated successfully.</p>

    <p>
        Email:
        <span th:text="${user.email}"></span>
    </p>

    <p>
        Role:
        <span th:text="${user.role}"></span>
    </p>

    <form th:action="@{/profile}" th:object="${profileRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <label for="firstName">First name</label>
        <input id="firstName" type="text" th:field="*{firstName}" required>
        <p th:errors="*{firstName}"></p>

        <label for="lastName">Last name</label>
        <input id="lastName" type="text" th:field="*{lastName}" required>
        <p th:errors="*{lastName}"></p>

        <label for="newPassword">New password</label>
        <input id="newPassword" type="password" th:field="*{newPassword}">
        <p th:errors="*{newPassword}"></p>

        <button type="submit">Save changes</button>
    </form>

    <form th:action="@{/logout}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <button type="submit">Logout</button>
    </form>

    <p><a th:href="@{/}">Back to home</a></p>
</body>
</html>
