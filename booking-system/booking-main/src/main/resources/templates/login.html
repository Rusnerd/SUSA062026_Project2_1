<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h1>Login</h1>

<p th:if="${param.error}">Invalid email or password.</p>
<p th:if="${param.logout}">You have been logged out.</p>
<p th:if="${param.registered}">Registration successful. You can now log in.</p>

<form th:action="@{/login}" method="post">
    <label>
        Email
        <input type="email" name="username" required>
    </label>

    <label>
        Password
        <input type="password" name="password" required>
    </label>

    <button type="submit">Login</button>
</form>

<a th:href="@{/register}">Create an account</a>
</body>
</html>
