server:
  port: 8080

spring:
  application:
    name: booking-main

  r2dbc:
    enabled: false

  datasource:
    url: jdbc:mysql://localhost:3306/booking_site_main?useSSL=false&serverTimezone=UTC
    username: root
    password: NEW_STRONG_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
