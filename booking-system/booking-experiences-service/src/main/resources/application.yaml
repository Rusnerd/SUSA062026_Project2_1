server:
  port: 8081

spring:
  application:
    name: booking-experiences-service
  datasource:
    url: jdbc:mysql://localhost:3306/booking_site?useSSL=false&serverTimezone=UTC
    username: root
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      #ddl-auto: none
      ddl-auto: update
    properties:
      hibernate:
        boot:
          allow_jdbc_metadata_access: false
        dialect: org.hibernate.dialect.MariaDBDialect

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
